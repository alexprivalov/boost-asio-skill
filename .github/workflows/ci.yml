name: CI

# Regression gate for the skill: build both worked examples and run their
# integration tests across platforms, compilers, C++ standards, and Boost versions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Both examples on macOS and Ubuntu.
  native:
    name: ${{ matrix.example.dir }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        example:
          - { dir: market-data-feed, port: "9090" }
          - { dir: market-data-feed-precpp20, port: "9092" }
          - { dir: market-data-feed-classic, port: "9093" }
    defaults:
      run:
        working-directory: examples/${{ matrix.example.dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost
      - name: Install Boost (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libssl-dev
      - name: Configure & build
        run: |
          PREFIX_ARG=""
          [ "$RUNNER_OS" = "macOS" ] && PREFIX_ARG="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          cmake -S . -B build $PREFIX_ARG
          cmake --build build
      - name: Integration test
        env:
          FEED_PORT: ${{ matrix.example.port }}
        run: |
          ./build/feed_server & SERVER=$!
          sleep 2
          python3 test_client.py
          RC=$?
          kill $SERVER 2>/dev/null || true
          exit $RC

  # Coroutine example needs Boost >= 1.77; Debian trixie ships 1.83.
  coroutine-debian-trixie:
    name: market-data-feed · debian:trixie (g++)
    runs-on: ubuntu-latest
    container: debian:trixie
    defaults:
      run:
        working-directory: examples/market-data-feed
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y g++ cmake make libboost-dev libssl-dev python3
      - run: cmake -S . -B build && cmake --build build
      - name: Integration test
        env: { FEED_PORT: "9090" }
        run: |
          ./build/feed_server & SERVER=$!
          sleep 2; python3 test_client.py; RC=$?; kill $SERVER 2>/dev/null || true; exit $RC

  # Pre-C++20 callback example builds on OLD Boost (bookworm 1.74) where coroutines can't.
  precpp20-debian-bookworm:
    name: market-data-feed-precpp20 · debian:bookworm (Boost 1.74)
    runs-on: ubuntu-latest
    container: debian:bookworm
    defaults:
      run:
        working-directory: examples/market-data-feed-precpp20
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y g++ cmake make libboost-dev libssl-dev python3
      - run: cmake -S . -B build && cmake --build build
      - name: Integration test
        env: { FEED_PORT: "9092" }
        run: |
          ./build/feed_server & SERVER=$!
          sleep 2; python3 test_client.py; RC=$?; kill $SERVER 2>/dev/null || true; exit $RC

  # Verify the pre-C++20 example at each C++ standard (it is C++11-clean).
  precpp20-standards:
    name: market-data-feed-precpp20 · c++${{ matrix.std }}
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        std: ["11", "14", "17"]
    defaults:
      run:
        working-directory: examples/market-data-feed-precpp20
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y g++ cmake make libboost-dev python3
      - run: cmake -S . -B build -DCMAKE_CXX_STANDARD=${{ matrix.std }} && cmake --build build
      - name: Integration test
        env: { FEED_PORT: "9092" }
        run: |
          ./build/feed_server & SERVER=$!
          sleep 2; python3 test_client.py; RC=$?; kill $SERVER 2>/dev/null || true; exit $RC

  # Fedora (recent g++ / Boost).
  precpp20-fedora:
    name: market-data-feed-precpp20 · fedora:latest (g++)
    runs-on: ubuntu-latest
    container: fedora:latest
    defaults:
      run:
        working-directory: examples/market-data-feed-precpp20
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y gcc-c++ cmake boost-devel python3
      - run: cmake -S . -B build && cmake --build build
      - name: Integration test
        env: { FEED_PORT: "9092" }
        run: |
          ./build/feed_server & SERVER=$!
          sleep 2; python3 test_client.py; RC=$?; kill $SERVER 2>/dev/null || true; exit $RC

  # Classic example on a very old, EOL distro (Ubuntu 18.04 = Boost 1.65, g++ 7,
  # cmake 3.10 — predates io_context). actions/checkout's node20 can't run inside
  # an 18.04 container (glibc too old), so we check out on the host and run the old
  # toolchain via docker, with the server+client both inside the container.
  classic-ubuntu-1804:
    name: market-data-feed-classic · ubuntu:18.04 (Boost 1.65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in ubuntu:18.04
        run: |
          docker run --rm -v "$PWD:/w" -w /w/examples/market-data-feed-classic ubuntu:18.04 bash -c '
            set -e
            # 18.04 is EOL; point apt at old-releases with just the base suite
            # (the -updates/-security/-backports suites are not mirrored there).
            echo "deb http://old-releases.ubuntu.com/ubuntu bionic main universe" > /etc/apt/sources.list
            apt-get update -qq
            apt-get install -y -qq g++ cmake libboost-dev libboost-system-dev python3
            g++ --version | head -1; cmake --version | head -1; dpkg -s libboost-dev | grep Version
            rm -rf build && mkdir build && cd build && cmake .. && make && cd ..
            ./build/feed_server & sleep 2
            FEED_PORT=9093 python3 test_client.py
          '

  # Windows / MSVC. The portable byte-order codec (no <arpa/inet.h>) is what lets
  # this build unchanged. Boost is installed explicitly (the runner images no
  # longer ship it); windows-2022 is pinned so the prebuilt Boost matches.
  precpp20-windows:
    name: market-data-feed-precpp20 · windows-2022 (MSVC)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: examples/market-data-feed-precpp20
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: boost
        with:
          boost_version: 1.83.0
          platform_version: 2022
          toolset: msvc
      - name: Configure & build
        run: |
          cmake -S . -B build -DBOOST_ROOT="${{ steps.boost.outputs.BOOST_ROOT }}"
          cmake --build build --config Release
      - name: Integration test
        env: { FEED_PORT: "9092" }
        run: |
          ./build/Release/feed_server.exe & SERVER=$!
          sleep 3
          python test_client.py
          RC=$?
          kill $SERVER 2>/dev/null || true
          exit $RC
